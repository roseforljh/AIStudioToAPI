name: aistudiotoapi-official
services:
  app:
    build:
      context: .
      args:
        VERSION: 1.3.6-integrated-tools
    image: aistudio-to-api:fork-real-stream
    container_name: aistudio-to-api
    restart: unless-stopped
    ports:
      - '127.0.0.1:18760:7860'
    env_file:
      - /opt/AIStudioToAPI/.env
    volumes:
      - /opt/AIStudioToAPI/auth:/app/configs/auth
      - /opt/AIStudioToAPI/data:/app/data
    networks:
      - existing
networks:
  existing:
    external: true
    name: aistudio-to-api_default
